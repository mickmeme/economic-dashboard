<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shirt/body -->
  <ellipse cx="50" cy="97" rx="28" ry="12" fill="#3A5FB0"/>

  <!-- Head -->
  <ellipse cx="50" cy="54" rx="34" ry="32" fill="#5C9840"/>

  <!-- Eye bumps -->
  <ellipse cx="35" cy="30" rx="13" ry="11" fill="#5C9840"/>
  <ellipse cx="65" cy="30" rx="13" ry="11" fill="#5C9840"/>

  <!-- Eye whites -->
  <ellipse cx="35" cy="32" rx="9.5" ry="8.5" fill="#FFFFFF"/>
  <ellipse cx="65" cy="32" rx="9.5" ry="8.5" fill="#FFFFFF"/>

  <!-- Heavy upper eyelids -->
  <path d="M25.5 30 Q35 21 44.5 30 Z" fill="#4A7D32"/>
  <path d="M55.5 30 Q65 21 74.5 30 Z" fill="#4A7D32"/>

  <!-- Pupils -->
  <circle cx="35" cy="34" r="4.5" fill="#111"/>
  <circle cx="65" cy="34" r="4.5" fill="#111"/>
  <!-- Eye shine -->
  <circle cx="37" cy="32" r="1.8" fill="white"/>
  <circle cx="67" cy="32" r="1.8" fill="white"/>

  <!-- Cheeks / lower face lighter -->
  <ellipse cx="50" cy="68" rx="23" ry="15" fill="#78C050"/>

  <!-- Pepe lips -->
  <path d="M29 67 Q38 61 50 63 Q62 61 71 67 Q66 76 50 77 Q34 76 29 67Z" fill="#C4905A"/>
  <path d="M29 67 Q50 71 71 67" fill="none" stroke="#8B5A2B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Glasses frames -->
  <rect x="22" y="23" width="21" height="14" rx="3.5" fill="none" stroke="#7B4A1A" stroke-width="2.5"/>
  <rect x="57" y="23" width="21" height="14" rx="3.5" fill="none" stroke="#7B4A1A" stroke-width="2.5"/>
  <!-- Bridge -->
  <line x1="43" y1="28" x2="57" y2="28" stroke="#7B4A1A" stroke-width="2"/>
  <!-- Arms -->
  <line x1="10" y1="27" x2="22" y2="27" stroke="#7B4A1A" stroke-width="2"/>
  <line x1="78" y1="27" x2="90" y2="27" stroke="#7B4A1A" stroke-width="2"/>

  <!-- Notepad -->
  <rect x="62" y="70" width="22" height="24" rx="2" fill="#F7E84A" stroke="#C0B200" stroke-width="1"/>
  <line x1="66" y1="76" x2="81" y2="76" stroke="#A09600" stroke-width="1.2"/>
  <line x1="66" y1="81" x2="81" y2="81" stroke="#A09600" stroke-width="1.2"/>
  <line x1="66" y1="86" x2="81" y2="86" stroke="#A09600" stroke-width="1.2"/>

  <!-- Pencil -->
  <g transform="rotate(-30 60 70)">
    <rect x="57" y="55" width="4.5" height="18" rx="1" fill="#FFC940"/>
    <rect x="57" y="55" width="4.5" height="4" rx="1" fill="#FFB0A8"/>
    <polygon points="57,73 61.5,73 59.2,80" fill="#FFEEDD"/>
    <line x1="57" y1="59" x2="61.5" y2="59" stroke="#E0A000" stroke-width="0.8"/>
  </g>
</svg>
