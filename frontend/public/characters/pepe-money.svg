<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shirt/body -->
  <ellipse cx="50" cy="97" rx="28" ry="12" fill="#1A1A2E"/>

  <!-- Head -->
  <ellipse cx="50" cy="54" rx="34" ry="32" fill="#5C9840"/>

  <!-- Eye bumps -->
  <ellipse cx="35" cy="30" rx="13" ry="11" fill="#5C9840"/>
  <ellipse cx="65" cy="30" rx="13" ry="11" fill="#5C9840"/>

  <!-- Eye whites -->
  <ellipse cx="35" cy="32" rx="9.5" ry="8.5" fill="#FFFFFF"/>
  <ellipse cx="65" cy="32" rx="9.5" ry="8.5" fill="#FFFFFF"/>

  <!-- Heavy upper eyelids -->
  <path d="M25.5 30 Q35 21 44.5 30 Z" fill="#4A7D32"/>
  <path d="M55.5 30 Q65 21 74.5 30 Z" fill="#4A7D32"/>

  <!-- Pupils - looking slightly smug/sideways -->
  <circle cx="36" cy="34" r="4.5" fill="#111"/>
  <circle cx="66" cy="34" r="4.5" fill="#111"/>
  <!-- Eye shine -->
  <circle cx="38" cy="32" r="1.8" fill="white"/>
  <circle cx="68" cy="32" r="1.8" fill="white"/>

  <!-- Cheeks / lower face lighter -->
  <ellipse cx="50" cy="68" rx="23" ry="15" fill="#78C050"/>

  <!-- Smug wide Pepe lips -->
  <path d="M28 66 Q38 60 50 62 Q62 60 72 66 Q68 77 50 78 Q32 77 28 66Z" fill="#C4905A"/>
  <path d="M28 66 Q50 70 72 66" fill="none" stroke="#8B5A2B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dollar-sign glasses left frame -->
  <rect x="21" y="22" width="22" height="15" rx="3.5" fill="none" stroke="#4CAF50" stroke-width="2.5"/>
  <!-- Dollar-sign glasses right frame -->
  <rect x="57" y="22" width="22" height="15" rx="3.5" fill="none" stroke="#4CAF50" stroke-width="2.5"/>
  <!-- $ left lens -->
  <text x="32" y="33" text-anchor="middle" font-size="10" font-weight="bold" fill="#4CAF50" font-family="sans-serif">$</text>
  <!-- $ right lens -->
  <text x="68" y="33" text-anchor="middle" font-size="10" font-weight="bold" fill="#4CAF50" font-family="sans-serif">$</text>
  <!-- Bridge -->
  <line x1="43" y1="28" x2="57" y2="28" stroke="#4CAF50" stroke-width="2"/>
  <!-- Arms -->
  <line x1="9" y1="27" x2="21" y2="27" stroke="#4CAF50" stroke-width="2"/>
  <line x1="79" y1="27" x2="91" y2="27" stroke="#4CAF50" stroke-width="2"/>

  <!-- Phone in hand (right side) -->
  <rect x="63" y="68" width="14" height="22" rx="2.5" fill="#222" stroke="#555" stroke-width="1"/>
  <rect x="65" y="71" width="10" height="13" rx="1" fill="#38BDF8"/>
  <!-- tiny chart on phone screen -->
  <polyline points="66,82 68,78 70,80 72,75 74,79" fill="none" stroke="#4CAF50" stroke-width="1.2"/>
  <!-- Home button -->
  <circle cx="70" cy="87" r="1.5" fill="#555"/>

  <!-- Cash bills fanned in other hand -->
  <g transform="translate(14, 70) rotate(-15)">
    <rect x="0" y="0" width="18" height="10" rx="1.5" fill="#85BB65" stroke="#5A8A40" stroke-width="0.8"/>
    <text x="9" y="7.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#2D5A1E" font-family="sans-serif">$</text>
  </g>
  <g transform="translate(11, 73) rotate(-5)">
    <rect x="0" y="0" width="18" height="10" rx="1.5" fill="#A0D87A" stroke="#5A8A40" stroke-width="0.8"/>
    <text x="9" y="7.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#2D5A1E" font-family="sans-serif">$</text>
  </g>
</svg>
