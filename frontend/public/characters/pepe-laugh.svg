<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shirt/body -->
  <ellipse cx="50" cy="97" rx="28" ry="12" fill="#2A1A1A"/>

  <!-- Head - tilted back slightly (shift up) -->
  <ellipse cx="50" cy="52" rx="34" ry="32" fill="#5C9840"/>

  <!-- Eye bumps -->
  <ellipse cx="35" cy="28" rx="13" ry="11" fill="#5C9840"/>
  <ellipse cx="65" cy="28" rx="13" ry="11" fill="#5C9840"/>

  <!-- Eyes squinted shut from laughing -->
  <path d="M25 32 Q35 24 45 32" fill="none" stroke="#3A6A22" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M55 32 Q65 24 75 32" fill="none" stroke="#3A6A22" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Squint eye detail (upper lid shadow) -->
  <path d="M26 30 Q35 25 44 30" fill="#4A7D32"/>
  <path d="M56 30 Q65 25 74 30" fill="#4A7D32"/>

  <!-- Tear drops -->
  <ellipse cx="26" cy="38" rx="3" ry="4.5" fill="#7EC8E3" opacity="0.85"/>
  <path d="M26 42 Q24 46 26 48 Q28 46 26 42" fill="#7EC8E3" opacity="0.85"/>
  <ellipse cx="74" cy="38" rx="3" ry="4.5" fill="#7EC8E3" opacity="0.85"/>
  <path d="M74 42 Q72 46 74 48 Q76 46 74 42" fill="#7EC8E3" opacity="0.85"/>

  <!-- Cheeks / lower face lighter (flushed from laughing) -->
  <ellipse cx="50" cy="68" rx="24" ry="16" fill="#78C050"/>

  <!-- Huge open laughing mouth -->
  <path d="M26 63 Q32 57 50 59 Q68 57 74 63 Q70 82 50 84 Q30 82 26 63Z" fill="#C4905A"/>
  <!-- Mouth interior -->
  <path d="M30 66 Q50 63 70 66 Q70 80 50 82 Q30 80 30 66Z" fill="#7A2020"/>
  <!-- Teeth top -->
  <rect x="35" y="64" width="8" height="6" rx="1.5" fill="white"/>
  <rect x="44" y="64" width="8" height="6" rx="1.5" fill="white"/>
  <rect x="53" y="64" width="8" height="6" rx="1.5" fill="white"/>
  <!-- Tongue -->
  <ellipse cx="50" cy="77" rx="9" ry="5" fill="#E05555"/>

  <!-- Raised eyebrows (floating above squinted eyes) -->
  <path d="M24 22 Q35 17 45 22" fill="none" stroke="#4A7D32" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55 22 Q65 17 76 22" fill="none" stroke="#4A7D32" stroke-width="2.5" stroke-linecap="round"/>

  <!-- LOL hands (little arms raised) -->
  <line x1="20" y1="75" x2="28" y2="65" stroke="#5C9840" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="77" r="4" fill="#5C9840"/>
  <line x1="80" y1="75" x2="72" y2="65" stroke="#5C9840" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="77" r="4" fill="#5C9840"/>
</svg>
